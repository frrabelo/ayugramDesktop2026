name: Build AyuGram

permissions:
  contents: write

on:
  push:
    branches:
      - dev
      - main
      - master
      - fix/ci-windows-pdb-fs
  pull_request:
    branches:
      - dev
      - main
      - master
      - fix/ci-windows-pdb-fs
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-2022
    if: false
    steps:
      - name: Free Disk Space (Windows)
        shell: pwsh
        run: |
          Write-Host "Verificando espaco em disco inicial..."
          Get-Volume
          if (Test-Path "C:\Microsoft\AndroidNDK") { Remove-Item -Recurse -Force C:\Microsoft\AndroidNDK -ErrorAction SilentlyContinue }
          if (Test-Path "C:\Program Files (x86)\Android") { Remove-Item -Recurse -Force "C:\Program Files (x86)\Android" -ErrorAction SilentlyContinue }
          if (Test-Path "C:\Program Files\Android") { Remove-Item -Recurse -Force "C:\Program Files\Android" -ErrorAction SilentlyContinue }
          if (Test-Path "C:\hostedtoolcache\windows\CodeQL") { Remove-Item -Recurse -Force "C:\hostedtoolcache\windows\CodeQL" -ErrorAction SilentlyContinue }
          if (Test-Path "C:\Program Files\LLVM") { Remove-Item -Recurse -Force "C:\Program Files\LLVM" -ErrorAction SilentlyContinue }
          Write-Host "Verificando espaco final..."
          Get-Volume

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install poetry
        run: |
          pip install poetry

      - name: Configure Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Prepare Windows libraries
        run: |
          .\Telegram\build\prepare\win.bat

      - name: Configure CMake
        run: |
          cd Telegram
          .\configure.bat x64 -D TDESKTOP_API_ID=2040 -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627

      - name: Build Project
        env:
          CL: '/FS /MP2'
          _CL_: '/Z7'
          PreferredToolArchitecture: 'x64'
        run: |
          cd out
          msbuild Telegram.sln /p:Configuration=Release /p:Platform=x64 /m

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Windows-x64
          path: out/Release/AyuGram.exe

  build-linux:
    name: Build Linux x64 (AppImage)
    runs-on: ubuntu-22.04
    env:
      LTO: ""
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo apt-get clean
          df -h

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          clean: false

      - name: Apply compatibility patches
        run: |
          # Fix 1: dispatch/event_epoll.c - Clang 21 -Wsign-conversion
          # uint16_t dmn_disarmed_events sofre promocao implicita para int
          # ao aplicar ~ (bitwise NOT), causando falha com -Werror,-Wsign-conversion
          sed -i 's/dmn->dmn_events \& ~dmn->dmn_disarmed_events/dmn->dmn_events \& ~(uint32_t)dmn->dmn_disarmed_events/' \
            Telegram/ThirdParty/dispatch/src/event/event_epoll.c

          # Fix 2: hime_im_client/CMakeLists.txt - lib_base PRIVATE -> PUBLIC
          # O linker GCC nao resolve referencias de biblioteca statica quando
          # a dependencia eh PRIVATE. PUBLIC propaga lib_base para o executavel final.
          sed -i '/desktop-app::external_qt_static_plugins_hime_im_client/{
            n
            s/PRIVATE/PUBLIC/
          }' cmake/external/qt/qt_static_plugins/hime/CMakeLists.txt
          sed -i 's/^PRIVATE$/PUBLIC/' cmake/external/qt/qt_static_plugins/hime/hime_im_client/CMakeLists.txt

          # Fix 3: kimageformats/CMakeLists.txt - adicionar brotlidec e brotlicommon no Linux
          # libjxl via PkgConfig nao resolve dependencias transitivas de libs estaticas.
          # libbrotlidec precisa de libbrotlicommon (BrotliSharedDictionary*).
          sed -i 's|\$<TARGET_NAME_IF_EXISTS:PkgConfig::DESKTOP_APP_JXL>|\$<TARGET_NAME_IF_EXISTS:PkgConfig::DESKTOP_APP_JXL>\n        \$<\$<BOOL:\${DESKTOP_APP_JXL_FOUND}>:brotlidec>\n        \$<\$<BOOL:\${DESKTOP_APP_JXL_FOUND}>:brotlicommon>|' \
            cmake/external/qt/qt_static_plugins/kimageformats/CMakeLists.txt

          # Fix 4: codegen_emoji/CMakeLists.txt - link order and unnecessary plugins
          python3 -c "
          import os
          filepath = 'Telegram/codegen/codegen/emoji/CMakeLists.txt'
          if os.path.exists(filepath):
              with open(filepath, 'r', encoding='utf-8') as f:
                  content = f.read().replace('\r\n', '\n')
              target = '    desktop-app::lib_base\n    desktop-app::codegen_common\n    desktop-app::external_qt_static_plugins\n    desktop-app::external_qt'
              replacement = '    desktop-app::codegen_common\n    desktop-app::external_qt\n    desktop-app::lib_base'
              if target in content:
                  with open(filepath, 'w', encoding='utf-8') as f:
                      f.write(content.replace(target, replacement))
                  print('Codegen emoji CMakeLists.txt patched successfully.')
          "

          echo "Patches aplicados com sucesso."

      - name: Prepare Linux libraries
        run: |
          docker pull ghcr.io/telegramdesktop/tdesktop/centos_env:latest

      - name: Build Project inside Docker
        run: |
          mkdir -p out
          sudo chmod -R a+rwx .
          docker run --rm \
              -v "$PWD:/usr/src/tdesktop" \
              ghcr.io/telegramdesktop/tdesktop/centos_env:latest \
              /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
              -D TDESKTOP_API_ID=2040 \
              -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627

      - name: Create tar.gz Package
        run: |
          # Criar diretório para empacotamento
          mkdir -p ayugram-desktop-linux
          
          # Encontrar e copiar o executável compilado
          if [ -f "out/Release/AyuGram" ]; then
              cp out/Release/AyuGram ayugram-desktop-linux/ayugram
          elif [ -f "out/Release/ayugram" ]; then
              cp out/Release/ayugram ayugram-desktop-linux/ayugram
          else
              find out/ -name "AyuGram" -exec cp {} ayugram-desktop-linux/ayugram \;
              find out/ -name "ayugram" -exec cp {} ayugram-desktop-linux/ayugram \;
          fi
          chmod +x ayugram-desktop-linux/ayugram

          # Compactar em .tar.gz
          tar -czvf ayugram-desktop-linux-x64.tar.gz -C ayugram-desktop-linux ayugram

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "latest-linux" ayugram-desktop-linux-x64.tar.gz \
            --title "AyuGram Linux Latest" \
            --notes "Build compilado automaticamente via GitHub Actions em $(date +'%Y-%m-%d %H:%M:%S')" \
            --prerelease \
            --clobber
